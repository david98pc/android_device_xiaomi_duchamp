name: Compilador de Recovery - TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Rama del Minimal-Manifest de TWRP'
        required: true
        default: 'twrp-14.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-14
        - twrp-12.1
        - twrp-11
      DEVICE_TREE:
        description: 'Repositorio de tu Device Tree'
        required: true
        default: 'https://github.com/david98pc/android_device_xiaomi_duchamp'
      DEVICE_TREE_BRANCH:
        description: 'Rama de tu Device Tree'
        required: true
        default: 'test'
      DEVICE_PATH:
        description: 'Ruta del dispositivo (ej. device/xiaomi/duchamp)'
        required: true
        default: 'device/xiaomi/duchamp'
      DEVICE_NAME:
        description: 'Nombre clave del dispositivo (ej. duchamp)'
        required: true
        default: 'duchamp'
      BUILD_TARGET:
        description: 'Objetivo de compilación (vendorboot para Poco X6 Pro)'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Ruta de los blobs a revisar (para dependencias FBE)'
        required: true
        default: 'vendor/bin/hw/android.hardware.security.keymint@3.0-service.mitee'

jobs:
  build:
    name: Compilando TWRP por ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:

    - name: 🧹  Limpieza crítica pre-sincronización
      run: |
        echo "--- Uso de disco inicial ---"
        df -h
        echo "Eliminando herramientas preinstaladas pesadas (Dotnet, Android SDK, Swift, etc.)..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/lib/jvm

        echo "Limpiando caché del sistema Docker (Ahorro masivo de espacio)..."
        sudo docker system prune -a --force
          
        echo "--- Uso de disco después de la limpieza agresiva ---"
        df -h
        
    - name: Configurar Memoria Swap
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
        
    - name: Checkout del Repositorio
      uses: actions/checkout@v4
      
    - name: Mostrar Variables de Entrada
      run: |
        echo "Mostrando variables de configuración:"
        echo "Rama del Manifest: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ inputs.DEVICE_TREE }}"
        echo "Rama del Device Tree: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Ruta del Dispositivo: ${{ inputs.DEVICE_PATH }}"
        echo "Nombre del Dispositivo: ${{ inputs.DEVICE_NAME }}"
        echo "Objetivo de compilación: ${{ inputs.BUILD_TARGET }}image"

    - name: Preparar el entorno de Ubuntu
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq --no-install-recommends \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Instalar OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Instalar Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Seleccionar origen del Manifest
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ inputs.MANIFEST_BRANCH == 'twrp-11' || inputs.MANIFEST_BRANCH == 'twrp-12.1' || inputs.MANIFEST_BRANCH == 'twrp-14' || inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Caché del código fuente (Repo Sync)
      uses: actions/cache@v4
      with:
        path: /home/runner/work/android-recovery 
        key: ${{ runner.os }}-repo-sync-${{ inputs.MANIFEST_BRANCH }}-${{ hashFiles('**/default.xml') }}
        restore-keys: |
          ${{ runner.os }}-repo-sync-

    - name: Inicializar Repo
      run: |
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        if [ ! -d ".repo" ]; then
          repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ inputs.MANIFEST_BRANCH }}
        else
          echo "El repositorio ya está inicializado desde la caché."
        fi
        
    - name: Sincronizar código fuente (Repo Sync)
      run: |
        cd android-recovery
        repo sync -j$(nproc --all) --force-sync
      
    - name: Clonar el Device Tree
      run: |
        cd android-recovery
        
        # LÍNEA MÁGICA: Borrar el rastro viejo del caché para forzar la lectura de tus últimos cambios
        rm -rf ${{ inputs.DEVICE_PATH }}
        
        # Ahora sí, clonamos el código fresco
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Verificar el Makefile del dispositivo
      run: |
        cd android-recovery
        if [ -f ${{ inputs.DEVICE_PATH }}/twrp_${{ inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ inputs.DEVICE_PATH }}/omni_${{ inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "¡No se encontró ningún makefile de recovery!"
        fi
      continue-on-error: true

    - name: Revisar espacio en disco antes de compilar
      run: |
        echo "--- Espacio en disco antes del build ---"
        df -h
        echo "--- Tamaño de la carpeta android-recovery ---"
        du -sh android-recovery

    - name: Compilando la Imagen
      run: |
        cd android-recovery
        export CCACHE_DIR=${{ github.workspace }}/.ccache
        ccache -M 50G 
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        # Lógica inteligente para el comando lunch en AOSP 14 (Con el parche ap2a)
        if [[ "${{ inputs.MANIFEST_BRANCH }}" == "twrp-14.1" || "${{ inputs.MANIFEST_BRANCH }}" == "twrp-14" ]]; then
          echo "Detectado AOSP 14: Usando formato estricto de lunch..."
          lunch ${{ env.DEVICE_MAKEFILE }}-ap2a-userdebug
        else
          echo "Detectado AOSP antiguo: Usando formato estándar..."
          lunch ${{ env.DEVICE_MAKEFILE }}-eng
        fi
        
        make clean && make ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Terminó la compilación de tu ${{ inputs.BUILD_TARGET }}.img"

    - name: Guardar caché de Ccache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ runner.os }}-ccache-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}
        restore-keys: |
          ${{ runner.os }}-ccache-
      
    - name: Configurar propiedades para el Release
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "VENDOR=$(echo "${{ inputs.DEVICE_PATH }}" | cut -d'/' -f2)" >> $GITHUB_ENV

    - name: Subir a Releases de GitHub (boot / recovery)
      if: inputs.BUILD_TARGET == 'boot' || inputs.BUILD_TARGET == 'recovery'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
        name: TWRP No Oficial para ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          **Versión Base:** ${{ inputs.MANIFEST_BRANCH }}
          **Dispositivo:** [Device Tree/Rama](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          **Commit exacto:** [Ver commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})

    - name: Subir a Releases de GitHub (vendor_boot)
      if: inputs.BUILD_TARGET == 'vendorboot'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img
        name: TWRP No Oficial para ${{ inputs.DEVICE_NAME }} (Vendor Boot) // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          **Versión Base:** ${{ inputs.MANIFEST_BRANCH }}
          **Dispositivo:** [Device Tree/Rama](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          **Commit exacto:** [Ver commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})

    - name: 🗑️ Limpieza final de disco
      if: always() 
      run: |
        echo "--- Espacio en disco ANTES de la limpieza final ---"
        df -h
        echo "Eliminando código fuente y compilaciones..."
        sudo rm -rf android-recovery
        echo "Limpiando Docker..."
        sudo docker system prune -a --force
        echo "Limpiando directorio de trabajo..."
        sudo rm -rf /home/runner/actions-runner/_work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/
        echo "--- Espacio en disco DESPUÉS de la limpieza final ---"
        df -h
