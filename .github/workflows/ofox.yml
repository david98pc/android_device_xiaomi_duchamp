name: OrangeFox - Build (Duchamp)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/david98pc/android_device_xiaomi_duchamp'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'test'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/xiaomi/duchamp'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'duchamp'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'vendor/bin/hw/android.hardware.security.keymint@3.0-service.mitee'
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Compilando OFRP por ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Blob a revisar: ${{ github.event.inputs.LDCHECK }}"
        echo "::endgroup::"

    - name: 🧹 Limpieza Crítica de Disco
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/swift
        sudo docker system prune -a --force
        sudo apt-get clean

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
       
    - name: Build Environment
      run: |
        sudo apt update && sudo apt -y upgrade
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq --no-install-recommends aria2 zip xz-utils bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
       
    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        rm -rf ${{ github.event.inputs.DEVICE_PATH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        # --- VARIABLES OBLIGATORIAS PARA ORANGEFOX EN POCO X6 PRO ---
        export FOX_VIRTUAL_AB_DEVICE=1
        export FOX_VENDOR_BOOT_RECOVERY=1
        export OF_IGNORE_LOGICAL_MOUNT_ERRORS=1
        export FOX_AB_DEVICE=1
        export OF_VIRTUAL_AB_PARTITION_GROUPS="main"
        
        set -e
        # --- Lógica inteligente para AOSP 14.1 vs versiones anteriores ---
        if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "14.1" ]]; then
          echo "Detectado AOSP 14.1: Usando formato estricto de lunch..."
          lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-ap2a-userdebug
        else
          echo "Detectado AOSP heredado: Usando formato estándar..."
          lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng
        fi
        
        make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        if [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "La carpeta de salida del recovery está vacía."
        fi

    - name: Rename the Recovery
      run: |
        cd ${{ env.FILE_PATH }}/
        if [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendorboot" ]; then
          mv OrangeFox*.img vendor_boot.img
          echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
          echo "vendor_boot.img file found!"
        fi
      continue-on-error: true
       
    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
          ${{ env.FILE_PATH }}/OrangeFox*.zip
        name: OrangeFox No Oficial para ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: OrangeFox ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.

    - name: Run LDCheck para dependencias FBE
      if: env.CHECK_IMG_IS_OK == 'true'
      run: |
        # Descargar el script oficial de LDCheck temporalmente
        wget https://raw.githubusercontent.com/twrpdtgen/ldcheck/master/ldcheck -O ldcheck.py
        
        # Moverse a la carpeta raíz del recovery
        cd ${{ env.FILE_PATH }}/recovery/root/
        
        echo "Analizando el blob de Microtrust: ${{ github.event.inputs.LDCHECK }} ..."
        python3 ${GITHUB_WORKSPACE}/ldcheck.py -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }}
      continue-on-error: true

    - name: 🗑️ Final Cleanup
      if: always() 
      run: |
        sudo rm -rf ${GITHUB_WORKSPACE}/OrangeFox
        sudo docker system prune -a --force
